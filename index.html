<style>
  /* Police "Aller" : utilisée si déjà installée sur l'appareil (ex. suite Office),
     sinon repli sur "Mulish" (Google Fonts, licence libre, esprit humanist proche). */
  :root{
    --navy:#CE1459;
    --navy-dark:#A80F47;
    --paper:#F5F6F8;
    --card:#FFFFFF;
    --line:#E3E6EC;
    --ink:#1C2430;
    --ink-soft:#5B6472;
    --ok:#1E7A46;
    --ok-bg:#E7F5EC;
    --bad:#B3261E;
    --bad-bg:#FCEAE9;
    --neutral:#6B7280;
    --neutral-bg:#EEF0F3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Aller','Mulish',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .app{max-width:640px;margin:0 auto;padding-bottom:120px;}

  .brand-strip{
    background:#fff;
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 18px;
    border-bottom:3px solid var(--navy);
  }
  .brand-strip img{height:32px;display:block;}
  .brand-strip .accent{width:34px;align-self:stretch;background:var(--navy);margin:-10px -18px -10px 10px;clip-path:polygon(40% 0,100% 0,100% 100%,0 100%);}

  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--navy);
    color:#fff;
    padding:14px 18px 12px;
  }
  .topbar h1{margin:0 0 2px;font-size:17px;font-weight:700;letter-spacing:.2px;}
  .topbar .sub{font-size:12px;color:#F3C9DA;margin-bottom:10px;}
  .progress-track{height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;}
  .progress-fill{height:100%;background:#7FB8A3;width:0%;transition:width .25s ease;}
  .progress-label{font-size:11px;color:#F3C9DA;margin-top:6px;display:flex;justify-content:space-between;}

  .nav-chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;background:var(--paper);position:sticky;top:66px;z-index:19;}
  .chip{
    flex:0 0 auto;font-size:12px;padding:6px 11px;border-radius:999px;
    background:var(--card);border:1px solid var(--line);color:var(--ink-soft);
    white-space:nowrap;
  }
  .chip.done{border-color:var(--ok);color:var(--ok);background:var(--ok-bg);}
  .chip.active{border-color:var(--navy);color:var(--navy);font-weight:600;}

  section.card{
    background:var(--card);
    margin:14px 14px 0;
    border-radius:14px;
    border:1px solid var(--line);
    padding:16px 16px 6px;
  }
  section.card h2{
    font-size:15px;margin:0 0 12px;color:var(--navy);
    display:flex;align-items:center;gap:8px;
  }
  section.card h2 .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:6px;background:var(--navy);color:#fff;
    font-size:12px;font-weight:700;flex:0 0 auto;
  }

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .field input, .field textarea, .field select{
    width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
    font-size:14px;font-family:inherit;background:#fff;color:var(--ink);
  }
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}

  .item{border-top:1px solid var(--line);padding:12px 0;}
  .item:first-of-type{border-top:none;padding-top:0;}
  .item p{margin:0 0 8px;font-size:13.5px;line-height:1.4;}
  .seg{display:flex;gap:6px;}
  .seg button{
    flex:1;padding:8px 4px;font-size:12px;font-weight:600;border-radius:8px;
    border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);
  }
  .seg button[data-v="C"].sel{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);}
  .seg button[data-v="NC"].sel{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}
  .seg button[data-v="SO"].sel{background:var(--neutral-bg);border-color:var(--neutral);color:var(--neutral);}
  .obs{margin-top:8px;}
  .obs input{font-size:12.5px;padding:7px 9px;}
  .obs input::placeholder{color:#A6ADB8;}

  .item-remove{
    margin-top:8px;background:none;border:none;color:var(--bad);font-size:11.5px;font-weight:600;padding:2px 0;
  }
  .add-item-row{display:flex;gap:8px;padding-top:12px;}
  .add-item-row input{
    flex:1;padding:9px 10px;border-radius:8px;border:1px solid var(--line);font-size:13.5px;font-family:inherit;
  }
  .add-item-row button{
    flex:0 0 auto;padding:9px 14px;border-radius:8px;border:none;background:var(--navy);color:#fff;
    font-size:13px;font-weight:700;
  }
  .empty-note{font-size:12.5px;color:var(--ink-soft);font-style:italic;padding:4px 0 8px;}

  .sign-pad{
    border:1.5px dashed var(--line);border-radius:10px;background:#FCFCFD;
    touch-action:none;width:100%;height:130px;display:block;
  }
  .sign-row{margin-bottom:8px;}
  .sign-actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .sign-actions .status{font-size:11.5px;color:var(--ink-soft);}
  .sign-actions .status.ok{color:var(--ok);font-weight:600;}
  .clear-btn{
    border:none;background:none;color:var(--navy);font-size:12px;font-weight:600;padding:4px 6px;
  }

  .footer-space{height:12px;}

  .sticky-cta{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:linear-gradient(180deg,rgba(245,246,248,0),var(--paper) 22%);
    padding:14px 14px 16px;
  }
  .sticky-cta-inner{max-width:640px;margin:0 auto;}
  .cta-btn{
    width:100%;padding:14px;border:none;border-radius:12px;
    background:var(--navy);color:#fff;font-size:15px;font-weight:700;
    box-shadow:0 6px 18px rgba(31,56,100,.28);
  }
  .cta-btn:disabled{background:#A8B2C2;box-shadow:none;}
  .cta-note{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:7px;}

  .toast{
    position:fixed;left:14px;right:14px;bottom:96px;z-index:40;
    background:var(--ink);color:#fff;padding:11px 14px;border-radius:10px;
    font-size:13px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.25);
    opacity:0;transform:translateY(8px);transition:all .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0);}
</style>

  const storageAdapter = {

      if(typeof window.storage !== 'undefined'){
        return window.storage.set(key, value, false);

    },

      if(typeof window.storage !== 'undefined'){
        try{ const r = await window.storage.get(key, false); return r ? r.value : null; }

      }
      try{ return localStorage.getItem(key); }catch(e){ return null; }

        const seg = document.createElement('div');
        seg.className = 'seg';
        [['C','Conforme'], ['NC','Non conf.'], ['SO','Sans objet']].forEach(([v, txt]) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.dataset.v = v;
          btn.textContent = txt;
          btn.addEventListener('click', () => { setResponse(id, v, item); queueSaveDraft(); });
          seg.appendChild(btn);
        });
        item.appendChild(seg);

        const obsWrap = document.createElement('div');
        obsWrap.className = 'obs';
        const obsInput = document.createElement('input');
        obsInput.type = 'text';
        obsInput.placeholder = 'Observation (facultatif)';
        obsInput.addEventListener('input', (e) => { setObservation(id, e.target.value); queueSaveDraft(); });
        obsWrap.appendChild(obsInput);
        item.appendChild(obsWrap);

        itemRefs[id] = { item, obsInput };
        card.appendChild(item);
      });

      container.appendChild(card);

      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.id = 'chip-' + section.key;
      chip.textContent = section.title;
      chip.onclick = () => document.getElementById('sec-' + section.key).scrollIntoView({behavior:'smooth', block:'start'});
      chips.appendChild(chip);
    });
  }

  function setResponse(id, value, item){
    state.responses[id] = state.responses[id] === value ? null : value;
    item.querySelectorAll('.seg button').forEach(b => b.classList.remove('sel'));
    if(state.responses[id]) item.querySelector('[data-v="' + state.responses[id] + '"]').classList.add('sel');
    updateProgress();
  }

  function setObservation(id, val){ state.observations[id] = val; }

  function updateProgress(){
    let answered = 0;
    SECTIONS.forEach(section => {
      let secAnswered = 0;
      section.items.forEach((_, idx) => { if(state.responses[itemId(section.key, idx)]) secAnswered++; });
      answered += secAnswered;
      const chip = document.getElementById('chip-' + section.key);
      chip.classList.toggle('done', secAnswered === section.items.length);
    });
    const pct = totalItems ? Math.round((answered/totalItems)*100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = answered + ' / ' + totalItems + ' points renseignés (' + pct + '%)';
  }

  buildSections();
  updateProgress();

  // --- Chapitre 5 : points de contrôle personnalisés ---
  let customItems = []; // [{id, label}]
  let customSeq = 0;

  function renderCustomItems(){
    const container = document.getElementById('customItemsContainer');
    container.innerHTML = '';
    if(customItems.length === 0){
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = 'Aucun point ajouté pour cette visite.';
      container.appendChild(note);
    }
    customItems.forEach(entry => {
      const item = document.createElement('div');
      item.className = 'item';

      const p = document.createElement('p');
      p.textContent = entry.label;
      item.appendChild(p);

      const seg = document.createElement('div');
      seg.className = 'seg';
      [['C','Conforme'], ['NC','Non conf.'], ['SO','Sans objet']].forEach(([v, txt]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.v = v;
        btn.textContent = txt;
        btn.addEventListener('click', () => { setResponse(entry.id, v, item); queueSaveDraft(); });
        seg.appendChild(btn);
      });
      item.appendChild(seg);

      const obsWrap = document.createElement('div');
      obsWrap.className = 'obs';
      const obsInput = document.createElement('input');
      obsInput.type = 'text';
      obsInput.placeholder = 'Observation (facultatif)';
      obsInput.addEventListener('input', (e) => { setObservation(entry.id, e.target.value); queueSaveDraft(); });
      obsWrap.appendChild(obsInput);
      item.appendChild(obsWrap);

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'item-remove';
      removeBtn.textContent = 'Supprimer ce point';
      removeBtn.addEventListener('click', () => {
        customItems = customItems.filter(e => e.id !== entry.id);
        delete state.responses[entry.id];
        delete state.observations[entry.id];
        delete itemRefs[entry.id];
        renderCustomItems();
        recomputeTotalItems();
        updateProgress();
        queueSaveDraft();
      });
      item.appendChild(removeBtn);

      itemRefs[entry.id] = { item, obsInput };
      container.appendChild(item);
    });
  }

  function addCustomItem(label, existingId){
    const id = existingId || ('custom_' + (customSeq++));
    customItems.push({ id, label });
    recomputeTotalItems();
    renderCustomItems();
    return id;
  }

  function recomputeTotalItems(){
    let t = 0;
    SECTIONS.forEach(s => t += s.items.length);
    t += customItems.length;
    totalItems = t;
  }

  document.getElementById('addCustomBtn').addEventListener('click', () => {
    const input = document.getElementById('newCustomLabel');
    const label = input.value.trim();
    if(!label) return;
    addCustomItem(label);
    input.value = '';
    updateProgress();
    queueSaveDraft();
  });

  renderCustomItems();

  const FIELD_IDS = ['f_date','f_site','f_operateur','f_auditeur','f_commande','f_dict','f_nature','f_gestionnaire','f_pointsforts','f_ecarts'];
  FIELD_IDS.forEach(id => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', () => queueSaveDraft());
  });

  // --- Signatures ---
  const signatures = {};
  function setupPad(name){
    const canvas = document.getElementById('sign_' + name);
    function resize(){
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      const ctx = canvas.getContext('2d');
      ctx.scale(ratio, ratio);
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#1C2430';
    }
    resize();
    const ctx = canvas.getContext('2d');
    let drawing = false, hasInk = false, last = null;

    function pos(e){
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    }
    function start(e){ e.preventDefault(); drawing = true; last = pos(e); }
    function move(e){
      if(!drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      last = p; hasInk = true;
      const st = document.getElementById('status_' + name);
      st.textContent = 'Signé'; st.classList.add('ok');
    }
    function end(){ if(drawing){ drawing = false; queueSaveDraft(); } }

    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);

    signatures[name] = {
      canvas,
      hasInk: () => hasInk,
      markRestored: () => { hasInk = true;
        const st = document.getElementById('status_' + name);
        st.textContent = 'Signé'; st.classList.add('ok'); },
      clear: () => { ctx.clearRect(0,0,canvas.width,canvas.height); hasInk = false;
        const st = document.getElementById('status_' + name);
        st.textContent = 'Non signé'; st.classList.remove('ok'); },
      dataUrl: () => canvas.toDataURL('image/png'),
    };
  }
  setupPad('operateur');
  setupPad('auditeur');

  window.clearSignature = function(name){ signatures[name].clear(); queueSaveDraft(); };

  // --- Persistance du brouillon ---
  let saveTimer = null;
  function queueSaveDraft(){
    clearTimeout(saveTimer);
    const el = document.getElementById('draftStatus');
    if(el) el.textContent = 'Enregistrement…';
    saveTimer = setTimeout(saveDraft, 500);
  }

  async function saveDraft(){
    const fields = {};
    FIELD_IDS.forEach(id => { const el = document.getElementById(id); if(el) fields[id] = el.value; });
    const payload = {
      fields,
      responses: state.responses,
      observations: state.observations,
      customItems: customItems,
      signatures: {
        operateur: signatures.operateur.hasInk() ? signatures.operateur.dataUrl() : null,
        auditeur: signatures.auditeur.hasInk() ? signatures.auditeur.dataUrl() : null,
      },
      savedAt: new Date().toISOString(),
    };
    await storageAdapter.set(DRAFT_KEY, JSON.stringify(payload));
    const el = document.getElementById('draftStatus');
    if(el) el.textContent = 'Brouillon enregistré';
  }

  function restoreSignature(name, dataUrl){
    if(!dataUrl) return;
    const canvas = signatures[name].canvas;
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => {
      const rect = canvas.getBoundingClientRect();
      ctx.drawImage(img, 0, 0, rect.width, rect.height);
      signatures[name].markRestored();
    };
    img.src = dataUrl;
  }

  async function loadDraft(){
    const raw = await storageAdapter.get(DRAFT_KEY);
    if(!raw) return;
    let payload;
    try{ payload = JSON.parse(raw); }catch(e){ return; }

    (payload.customItems || []).forEach(entry => {
      const num = parseInt(String(entry.id).replace('custom_',''), 10);
      if(!isNaN(num) && num >= customSeq) customSeq = num + 1;
      addCustomItem(entry.label, entry.id);
    });

    Object.entries(payload.fields || {}).forEach(([id, val]) => {
      const el = document.getElementById(id);
      if(el) el.value = val;
    });

    Object.entries(payload.responses || {}).forEach(([id, val]) => {
      if(!val) return;
      const ref = itemRefs[id];
      if(!ref) return;
      state.responses[id] = val;
      ref.item.querySelectorAll('.seg button').forEach(b => b.classList.remove('sel'));
      const btn = ref.item.querySelector('[data-v="' + val + '"]');
      if(btn) btn.classList.add('sel');
    });

    Object.entries(payload.observations || {}).forEach(([id, val]) => {
      state.observations[id] = val;
      const ref = itemRefs[id];
      if(ref && ref.obsInput) ref.obsInput.value = val;
    });

    if(payload.signatures){
      restoreSignature('operateur', payload.signatures.operateur);
      restoreSignature('auditeur', payload.signatures.auditeur);
    }

    updateProgress();
    const el = document.getElementById('draftStatus');
    if(el) el.textContent = 'Brouillon restauré';
  }

  async function resetForm(skipConfirm){
    if(!skipConfirm && !window.confirm('Effacer la visite en cours et repartir sur une nouvelle grille vierge ?')) return;
    FIELD_IDS.forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
    Object.keys(state.responses).forEach(k => delete state.responses[k]);
    Object.keys(state.observations).forEach(k => delete state.observations[k]);
    Object.values(itemRefs).forEach(ref => {
      ref.item.querySelectorAll('.seg button').forEach(b => b.classList.remove('sel'));
      if(ref.obsInput) ref.obsInput.value = '';
    });
    customItems = [];
    recomputeTotalItems();
    renderCustomItems();
    signatures.operateur.clear();
    signatures.auditeur.clear();
    await storageAdapter.delete(DRAFT_KEY);
    updateProgress();
    const el = document.getElementById('draftStatus');
    if(el) el.textContent = '\u00A0';
  }
  document.getElementById('resetBtn').addEventListener('click', () => resetForm(false));

  loadDraft();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* pas de SW en aperçu Claude, normal */ });
    });
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3200);
  }

  window.generateAndShare = async function(){
    if(!signatures.operateur.hasInk() || !signatures.auditeur.hasInk()){
      showToast('Les deux signatures sont requises avant envoi.');
      return;
    }
    const btn = document.getElementById('generateBtn');
    btn.disabled = true; btn.textContent = 'Génération du PDF…';

    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit:'pt', format:'a4' });
      const navy = [206, 20, 89];
      const pageWidth = doc.internal.pageSize.getWidth();
      let y;

      // Bandeau RiCOM en en-tête de la première page
      const bandeauRatio = 444 / 2472;
      const bandeauH = pageWidth * bandeauRatio;
      doc.addImage(BANDEAU_DATA_URI, 'JPEG', 0, 0, pageWidth, bandeauH);
      y = bandeauH + 26;

      doc.setFontSize(16); doc.setTextColor(...navy); doc.setFont(undefined,'bold');
      doc.text('GRILLE DE VISITE SÉCURITÉ TERRAIN', pageWidth/2, y, {align:'center'});
      y += 16;
      doc.setFontSize(10); doc.setTextColor(90,90,90); doc.setFont(undefined,'italic');
      doc.text("Études de réseau et détection de réseaux souterrains", pageWidth/2, y, {align:'center'});
      y += 20;

      const idFields = [
        ['Date de la visite', document.getElementById('f_date').value, 'Site / chantier', document.getElementById('f_site').value],
        ["Opérateur(s) observé(s)", document.getElementById('f_operateur').value, 'Auditeur / visiteur', document.getElementById('f_auditeur').value],
        ['Référence affaire client', document.getElementById('f_commande').value, 'Référence affaire RiCOM', document.getElementById('f_dict').value],
        ["Nature de l'intervention", document.getElementById('f_nature').value, 'Client', document.getElementById('f_gestionnaire').value],
      ];
      doc.autoTable({
        startY:y, theme:'grid', styles:{fontSize:9, cellPadding:5},
        columnStyles:{0:{fontStyle:'bold', fillColor:[240,242,246]}, 2:{fontStyle:'bold', fillColor:[240,242,246]}},
        body: idFields,
      });
      y = doc.lastAutoTable.finalY + 18;

      SECTIONS.forEach(section => {
        if(y > 720){ doc.addPage(); y = 40; }
        doc.setFontSize(12); doc.setTextColor(...navy); doc.setFont(undefined,'bold');
        doc.text(section.num + '. ' + section.title, 40, y);
        y += 8;

        const rows = section.items.map((label, idx) => {
          const r = state.responses[itemId(section.key, idx)];
          const obs = state.observations[itemId(section.key, idx)] || '';
          return [label, r==='C'?'X':'', r==='NC'?'X':'', r==='SO'?'X':'', obs];
        });

        doc.autoTable({
          startY:y+6, theme:'grid', styles:{fontSize:8.5, cellPadding:4},
          headStyles:{fillColor:navy, textColor:255, fontStyle:'bold'},
          columnStyles:{
            0:{cellWidth:230}, 1:{cellWidth:32, halign:'center'},
            2:{cellWidth:32, halign:'center'}, 3:{cellWidth:32, halign:'center'},
            4:{cellWidth:'auto'},
          },
          head:[['Point de contrôle','C','NC','S.O.','Observations']],
          body: rows,
        });
        y = doc.lastAutoTable.finalY + 16;
      });

      if(y > 720){ doc.addPage(); y = 40; }
      doc.setFontSize(12); doc.setTextColor(...navy); doc.setFont(undefined,'bold');
      doc.text('5. Risque ou point particulier', 40, y);
      y += 8;

      if(customItems.length === 0){
        doc.setFontSize(9); doc.setTextColor(120,120,120); doc.setFont(undefined,'italic');
        doc.text('Aucun point ajouté pour cette visite.', 40, y + 14);
        y += 28;
      } else {
        const customRows = customItems.map(entry => {
          const r = state.responses[entry.id];
          const obs = state.observations[entry.id] || '';
          return [entry.label, r==='C'?'X':'', r==='NC'?'X':'', r==='SO'?'X':'', obs];
        });
        doc.autoTable({
          startY:y+6, theme:'grid', styles:{fontSize:8.5, cellPadding:4},
          headStyles:{fillColor:navy, textColor:255, fontStyle:'bold'},
          columnStyles:{
            0:{cellWidth:230}, 1:{cellWidth:32, halign:'center'},
            2:{cellWidth:32, halign:'center'}, 3:{cellWidth:32, halign:'center'},
            4:{cellWidth:'auto'},
          },
          head:[['Point de contrôle','C','NC','S.O.','Observations']],
          body: customRows,
        });
        y = doc.lastAutoTable.finalY + 16;
      }

      if(y > 650){ doc.addPage(); y = 40; }
      doc.setFontSize(12); doc.setTextColor(...navy); doc.setFont(undefined,'bold');
      doc.text('6. Synthèse de la visite', 40, y); y += 8;
      doc.autoTable({
        startY:y+6, theme:'grid', styles:{fontSize:9, cellPadding:6},
        headStyles:{fillColor:navy, textColor:255, fontStyle:'bold'},
        head:[['Points forts / bonnes pratiques', 'Écarts constatés / actions correctives']],
        body:[[
          document.getElementById('f_pointsforts').value || ' ',
          document.getElementById('f_ecarts').value || ' ',
        ]],
      });
      y = doc.lastAutoTable.finalY + 24;

      if(y > 650){ doc.addPage(); y = 40; }
      const sigW = 220, sigH = 70;
      doc.setFontSize(10); doc.setTextColor(30,30,30); doc.setFont(undefined,'normal');
      doc.text("Signature de l'opérateur", 40, y);
      doc.text("Signature de l'auditeur", 40 + sigW + 30, y);
      doc.addImage(signatures.operateur.dataUrl(), 'PNG', 40, y+6, sigW, sigH);
      doc.addImage(signatures.auditeur.dataUrl(), 'PNG', 40 + sigW + 30, y+6, sigW, sigH);

      const siteName = (document.getElementById('f_site').value || 'site').replace(/[^a-z0-9]+/gi,'_');
      const dateVal = document.getElementById('f_date').value || new Date().toISOString().slice(0,10);
      const filename = 'Visite_securite_' + siteName + '_' + dateVal + '.pdf';

      const blob = doc.output('blob');
      const file = new File([blob], filename, { type:'application/pdf' });

      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({
          files:[file],
          title:'Visite sécurité terrain',
          text:'Compte-rendu de visite sécurité signé — ' + (document.getElementById('f_site').value || ''),
        });
        showToast('PDF transmis à votre appli mail.');
        await resetForm(true);
      } else {
        doc.save(filename);
        showToast('PDF téléchargé — joignez-le manuellement à votre mail.');
      }
    } catch(err){
      if(err && err.name === 'AbortError'){
        showToast('Envoi annulé — le brouillon reste enregistré.');
      } else {
        console.error(err);
        showToast("Erreur lors de la génération du PDF.");
      }
    } finally {
      btn.disabled = false; btn.textContent = 'Générer le PDF et l\'envoyer';
    }
  };

})();
</script>
